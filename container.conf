[global]
server.socket_host : '0.0.0.0'
server.socket_port : int(os.environ.get('PORT', '8447'))
database.path : os.path.join(os.environ.get('DATA_DIR', '/data'), '')
database.name : 'checkMeIn.db'
sync.token           : os.environ.get('SYNC_TOKEN', '')
bigquery.credentials : os.environ.get('BIGQUERY_CREDENTIALS', '')
bigquery.credentials_json : os.environ.get('BIGQUERY_CREDENTIALS_JSON', '')
bigquery.project     : os.environ.get('BIGQUERY_PROJECT', '')
bigquery.dataset     : 'checkmein'

[/]
tools.proxy.on : True
tools.staticdir.root : os.path.abspath(os.getcwd())
tools.sessions.on : True
tools.sessions.storage_class : cherrypy.lib.sessions.FileSession
tools.sessions.storage_path : os.path.join(os.environ.get('DATA_DIR', '/data'), 'sessions')
tools.sessions.timeout : 60 * 24 * 365
tools.sessions.httponly : True
tools.sessions.secure : True
tools.sessions.locking : 'explicit'

[/favicon.ico]
tools.staticfile.on : True
tools.staticfile.filename : os.path.join(os.getcwd(), 'static/favicon.ico')

[/robots.txt]
tools.staticfile.on : True
tools.staticfile.filename : os.path.join(os.getcwd(),  'static/robots.txt')

[/static]
tools.staticdir.on : True
tools.staticdir.dir : 'static'
